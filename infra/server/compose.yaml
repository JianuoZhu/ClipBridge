services:
  haproxy:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    read_only: true
    tmpfs:
      - /var/lib/haproxy:size=8m
      - /var/run:size=8m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 5s
      retries: 3
